# Two listeners: devices on 8883 with client certificates from the private
# CA (the certificate's CN is the device id and becomes the username), and
# the API on 1884 inside the compose network with a password.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
max_queued_messages 10000
message_size_limit 1048576

listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

listener 1884 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

acl_file /mosquitto/config/acl
