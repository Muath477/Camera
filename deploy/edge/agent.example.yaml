device_id: 00000000-0000-0000-0000-000000000000
tenant_id: 00000000-0000-0000-0000-000000000000

# Networks behind the site's router to search for cameras, besides the
# camera port. Inside a container the agent cannot see them by itself.
# Private ranges only; anything wider than /24 is narrowed to a /24.
home_subnets:
  - 192.168.1.0/24

cloud:
  broker_url: ssl://mqtt.camera.sa:8883
  api_url: https://device-api.camera.sa
  ca_file: /etc/camera/pki/ca.pem
  cert_file: /etc/camera/pki/device.pem
  key_file: /etc/camera/pki/device.key

frigate:
  url: http://frigate:5000
  broker_url: tcp://mosquitto:1883
  config_path: /config/config.yml
  detector: openvino

go2rtc_url: http://frigate:1984
# On-device image embedder for search by description (ai/embedder).
embedder_url: http://embedder:8000/embed-image
recordings_path: /media/frigate
profiles_dir: /etc/camera/profiles
retention_days: 90
health_interval: 30s
thumb_interval: 15s
